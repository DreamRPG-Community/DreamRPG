import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
        maven {
            name = "Paper"
            url = uri("https://repo.papermc.io/repository/maven-public/")
        }
        maven {
            name = "Lumine"
            url = uri("https://mvn.lumine.io/repository/maven-public/")
        }
    }
}

includeBuild("../DreamLib") {
    dependencySubstitution {
        substitute module("self-written:DreamLib") using project(":")
    }
}

rootProject.name = "DreamRPG"

includeBuild("../DreamNPC")
includeBuild("../DreamChest")

includeBuild("../DreamWorld") {
    dependencySubstitution {
        substitute module("self-written:DreamWorld") using project(":")
    }
}
