plugins {
    id "java-library"
}

group = "self-written"
def buildVersion = providers.gradleProperty("projectVersion").getOrElse("1.0.0")
version = buildVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs.add("-Xlint:all")
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.named("processResources") {
    filesMatching("plugin.yml") {
        expand(version: buildVersion)
    }
}

tasks.withType(Jar).configureEach {
    archiveBaseName = "DreamRPG"
    archiveVersion = ""
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

def paperApiVersion = "1.12.2-R0.1-20190714.184133-413"

dependencies {
    compileOnly("com.destroystokyo.paper:paper-api:${paperApiVersion}")
    compileOnly("self-written:DreamLib:${project.version}")
    compileOnly("self-written:DreamWorld:${project.version}")
    compileOnly("self-written:DreamNPC:${project.version}")
    compileOnly("self-written:DreamChest:${project.version}")
    compileOnly("io.lumine.xikage:MythicMobs:4.12.0")
    testImplementation("io.lumine.xikage:MythicMobs:4.12.0")
    testImplementation("self-written:DreamChest:${project.version}")
    testImplementation("org.yaml:snakeyaml:1.19")

    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.2")
    testImplementation("com.destroystokyo.paper:paper-api:${paperApiVersion}")
    testImplementation("self-written:DreamLib:${project.version}")
    testRuntimeOnly("self-written:DreamLib:${project.version}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.10.2")
    testRuntimeOnly("org.xerial:sqlite-jdbc:3.46.1.3")
}
