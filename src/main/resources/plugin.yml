name: DreamRPG
version: ${version}
main: cn.mythicland.dreamrpg.DreamRPGPlugin
author: ShanguanLinG
load: POSTWORLD
depend:
- DreamLib
- DreamWorld
- MythicMobs
- ProtocolLib
- DreamNPC
- DreamChest
- DeluxeMenus
softdepend:
- PlaceholderAPI
- Vault
- PlayerPoints
- ViaVersion
- ViaBackwards
- ViaRewind
- LuckPerms
loadbefore:
- QuickShop
description: Shared RPG foundation for the DreamRPG server.
commands:
  titles:
    description: Select titles or manage title definitions and grants.
    aliases:
    - ch
  warp:
    description: Travel to a configured RPG location.
    usage: /warp <location>
  dreamrpg:
    description: Manage DreamRPG features.
    aliases:
    - drpg
    - trade
  spawn:
    description: Teleport to the DreamRPG main-city spawn.
  setspawn:
    description: Set the DreamRPG main-city spawn.
    permission: dreamrpg.admin
  heal:
    description: Restore your health or an online player's health to full.
    usage: /heal [player]
    permission: dreamrpg.admin
  gm:
    description: Change the executing player's game mode.
    permission: dreamrpg.admin
  enderchest:
    description: Open the DreamRPG custom ender chest.
    aliases:
    - ec
  inv:
    description: Open an online player's inventory for editing.
    aliases:
    - inventory
  settings:
    description: Open the DreamRPG player settings menu.
    usage: /settings
  member:
    description: Manage MythicMemberLib memberships.
    aliases:
    - mythicmembership
    - mms
permissions:
  dreamrpg.admin:
    description: Allows DreamRPG administration commands.
    default: op
    children:
      dreamnpc.admin: true
      dreamchest.admin: true
      dreamworld.admin: true
      dreamworld.protect.admin: true
      dreamworld.region.admin: true
      dreamchest.reload: true
      dreamworld.protect.edit: true
  dreamrpg.chat.color:
    description: Allows legacy colors in chat messages.
    default: op
  dreamrpg.stats:
    description: View your DreamRPG combat attributes.
    default: true
  dreamrpg.quests:
    description: Open task and NPC exchange menus.
    default: true
  mythicmembership.admin:
    description: Allows membership administration commands.
    default: op
